version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: stock-api-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stock_db
      POSTGRES_USER: stock_user
      # docker compose charge automatiquement le fichier .env du répertoire :
      # copiez .env.example vers .env et renseignez POSTGRES_PASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant — copiez .env.example vers .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
