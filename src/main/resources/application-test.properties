# === H2 TEST PROFILE ===
# Secret JWT dédié aux tests (jamais utilisé en production) : >= 32 octets décodés.
jwt.secret=ZGV2LXRlc3Qtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctbXVzdC1iZS1sb25nLWVub3VnaA==

# Surchargeable par variables d'environnement (ex. CI) : défaut = H2 in-memory.
# La CI passe SPRING_DATASOURCE_URL/USERNAME/PASSWORD ; le driver suit via
# SPRING_DATASOURCE_DRIVER_CLASS_NAME (sinon le driver H2 rejetterait une URL
# PostgreSQL — cf. échec du premier run CI).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway désactivé en tests : le schéma H2 est généré par Hibernate (create-drop).
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
