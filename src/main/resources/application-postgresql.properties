# === JWT ===
# Secret de signature (Base64, >= 32 octets décodés) — OBLIGATOIRE, lu depuis
# la variable JWT_SECRET (ou le fichier .env, voir application.properties).
# Aucun secret en dur dans le dépôt : abandon du démarrage si absent.
jwt.secret=${JWT_SECRET}

# === POSTGRESQL DATASOURCE ===
# Le mot de passe est OBLIGATOIRE (variable d'environnement DB_PASSWORD, voir .env.example).
# L'application refuse de démarrer sans : aucun secret en dur dans le dépôt.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_db}
spring.datasource.username=${DB_USERNAME:stock_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / HIBERNATE ===
# validate : Hibernate ne fait qu'auditer le schéma, il ne le modifie plus.
# Le schéma est géré exclusivement par les migrations Flyway (V1 initialisation,
# V2+ évolutions) — toute évolution d'entité doit passer par une migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
