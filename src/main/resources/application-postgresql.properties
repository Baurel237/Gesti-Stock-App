# === POSTGRESQL DATASOURCE ===
# Le mot de passe est OBLIGATOIRE (variable d'environnement DB_PASSWORD, voir .env.example).
# L'application refuse de démarrer sans : aucun secret en dur dans le dépôt.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_db}
spring.datasource.username=${DB_USERNAME:stock_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
