# === APPLICATION ===
spring.application.name=stock-api
spring.profiles.active=postgresql

# === ENV LOCAL ===
# Charge le fichier .env du répertoire (JWT_SECRET, DB_PASSWORD...) pour les
# lancements sans dev.sh (IDE, mvnw spring-boot:run). Les variables déjà
# présentes dans l'environnement ont toujours la priorité.
spring.config.import=optional:file:.env[.properties]

# === SERVER ===
server.port=8080

# Images produits stockées hors du répertoire public ; configurable par environnement.
stock.product-image.storage-dir=${PRODUCT_IMAGE_STORAGE_DIR:uploads/product-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# === FLYWAY ===
# La base existante a été créée par Hibernate (ddl-auto=update) : on pose la
# baseline avant la première migration, puis V2/V3... s'appliquent normalement.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
